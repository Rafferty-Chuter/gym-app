# Nightly backup of the Supabase database (TR6). Supabase Free keeps no
# backups, so this takes one: a pg_dump of the `public` schema (every app
# table) and the `auth` schema (accounts), encrypted with a passphrase and
# kept as a workflow artifact for 30 days.
#
# This repo is public: anyone signed in to GitHub can read these run logs and
# download the artifacts. The logs therefore show versions, table names and a
# file size, never rows, and the file is only ever uploaded encrypted.
#
# Setup (two secrets), the first run and how to restore: docs/plan/backups.md.

name: Database backup

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC; off the hour, when GitHub's scheduled queue is busiest
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

defaults:
  run:
    shell: bash # -e and pipefail

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PGSSLMODE: require
      PGCONNECT_TIMEOUT: "20"
    steps:
      - name: Check the secrets are set
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          ok=1
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::The SUPABASE_DB_URL secret is not set. See docs/plan/backups.md."
            ok=0
          fi
          case "$SUPABASE_DB_URL" in
            *:6543/*)
              echo "::error::SUPABASE_DB_URL is the Transaction pooler (port 6543), where pg_dump can't run. Use the Session pooler (port 5432)."
              ok=0
              ;;
          esac
          # The artifact is downloadable by anyone signed in to GitHub, so the
          # passphrase is all that protects it.
          if [ "${#BACKUP_PASSPHRASE}" -lt 24 ]; then
            echo "::error::The BACKUP_PASSPHRASE secret is not set or is shorter than 24 characters. See docs/plan/backups.md."
            ok=0
          fi
          [ "$ok" = 1 ]

      - name: Install pg_dump for the server's Postgres version
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # pg_dump must be at least the server's major version, and a dump
          # from a newer pg_dump may not restore with the Postgres on the
          # founder's Mac, so match the server exactly.
          if [ ! -x /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-common > /dev/null
          fi
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
          command -v psql > /dev/null || sudo apt-get install -y -qq postgresql-client > /dev/null
          if ! num=$(psql "$SUPABASE_DB_URL" -XAtqc "show server_version_num"); then
            echo "::error::Could not connect. Use the Session pooler string (port 5432, user backup_reader.<project-ref>); the Direct connection is IPv6 only and GitHub's runners can't reach it. See docs/plan/backups.md."
            exit 1
          fi
          major=$((num / 10000))
          sudo apt-get install -y -qq "postgresql-client-$major" > /dev/null
          echo "PG_BIN=/usr/lib/postgresql/$major/bin" >> "$GITHUB_ENV"
          echo "Server: Postgres $major. Client: $("/usr/lib/postgresql/$major/bin/pg_dump" --version)"

      - name: Dump, encrypt and check
        id: dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          umask 077
          name="gym-app-db-$(date -u +%Y-%m-%d-%H%M)"
          dir="$RUNNER_TEMP/backup"
          mkdir -p "$dir"
          plain="$dir/$name.dump"
          out="$dir/$name.dump.gpg"

          # Custom format: compressed, and pg_restore can pick single tables
          # out of it. The rows of sign-in sessions, tokens and the auth audit
          # log are left out (their tables stay): after a restore people sign
          # in again, and no backup holds a live token or an IP address.
          "$PG_BIN/pg_dump" "$SUPABASE_DB_URL" \
            --format=custom \
            --schema=public \
            --schema=auth \
            --exclude-table-data=auth.sessions \
            --exclude-table-data=auth.refresh_tokens \
            --exclude-table-data=auth.mfa_amr_claims \
            --exclude-table-data=auth.mfa_challenges \
            --exclude-table-data=auth.one_time_tokens \
            --exclude-table-data=auth.flow_state \
            --exclude-table-data=auth.audit_log_entries \
            --file="$plain"

          # Table names only, for the run summary.
          tables=$("$PG_BIN/pg_restore" --list "$plain" | awk '$4 == "TABLE" && $5 == "DATA" { print $6 "." $7 }')
          if ! grep -q '^public\.' <<< "$tables"; then
            echo "::error::The dump has no tables from the public schema."
            exit 1
          fi

          # The passphrase goes to gpg on a file descriptor, never as an argument.
          gpg_pass() {
            gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 3 "$@" 3< <(printf '%s' "$BACKUP_PASSPHRASE")
          }
          gpg_pass --symmetric --cipher-algo AES256 --compress-algo none --output "$out" "$plain"
          rm -f "$plain"

          # Read the whole encrypted file back: the passphrase opens it, gpg's
          # integrity check passes and pg_restore reads every block to the end.
          gpg_pass --decrypt "$out" | "$PG_BIN/pg_restore" --file=/dev/null

          size_kb=$(( $(wc -c < "$out") / 1024 ))
          count=$(grep -c . <<< "$tables")
          echo "Encrypted backup $name.dump.gpg: $size_kb KB, $count tables, checked."
          {
            echo "### $name.dump.gpg"
            echo "Encrypted, $size_kb KB, read back in full after encrypting. Tables whose rows it holds:"
            echo
            awk '{ print "- " $0 }' <<< "$tables"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Upload the encrypted backup
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.dump.outputs.path }}
          archive: false
          retention-days: 30
          if-no-files-found: error
